name: Build Docker

# Publica astecfsph/farmacia:back e astecfsph/farmacia:front no Docker Hub a cada push na main.
# Em pull request só faz o build (tsc / lint / vite build rodam dentro do Dockerfile), sem publicar.
# Secrets obrigatórios (Settings > Secrets and variables > Actions): DOCKER_USERNAME e DOCKER_PASSWORD.
# Variables (Settings > Secrets and variables > Actions > Variables), fixadas no bundle do front:
#   VITE_API_BASE_URL  opcional; vazia = http://<host-do-navegador>:3005
#   VITE_API_AUTH      opcional; vazia = http://<host-do-navegador>:3008
#   VITE_API_SA        opcional; vazia = http://<host-do-navegador>:3007

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: back
            context: backend
            image: astecfsph/farmacia
          - name: front
            context: frontend
            image: astecfsph/farmacia
    name: docker (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # back/front + sha do commit (rollback no Portainer com BACK_TAG/FRONT_TAG=<name>-<sha>)
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.image }}:${{ matrix.name }}
            ${{ matrix.image }}:${{ matrix.name }}-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_API_AUTH=${{ vars.VITE_API_AUTH }}
            VITE_API_SA=${{ vars.VITE_API_SA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
