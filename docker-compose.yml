# Stack da Farmácia Ambulatorial para o Portainer (imagens publicadas por .github/workflows/docker.yml).
# Portainer > Stacks > Add stack > Repository (este repo, arquivo docker-compose.yml) ou Web editor.
# Variáveis em "Environment variables" do stack; localmente, num .env ao lado deste arquivo.
# O banco MySQL é externo (DB_HOST); não há container de banco neste stack.
#
# Comunicação front -> back: o front é só arquivo estático. Quem chama a API é o NAVEGADOR do usuário,
# não o container do front. Por isso o back fica publicado no host (porta 3005) e o front monta a URL
# como http://<host que o usuário abriu>:3005. As variáveis VITE_* são fixadas no build (GitHub Actions);
# defini-las aqui no Portainer não tem efeito.
services:
  farmacia-back:
    # Rollback: BACK_TAG=back-<sha do commit>
    image: astecfsph/farmacia:${BACK_TAG:-back}
    container_name: farmacia-back
    ports:
      # Porta fixa: o front chama http://<host>:3005. Para trocar, mude aqui E rebuild
      # o front com a Variable VITE_API_BASE_URL no GitHub.
      - "3005:3005"
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3005
      - DB_HOST=${DB_HOST:?defina DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:?defina DB_USER}
      - DB_PASS=${DB_PASS:?defina DB_PASS}
      # Autenticação: todo token é validado no barramento (backend/middleware/auth.ts)
      - URL_AUTH_BARRAMENTO=${URL_AUTH_BARRAMENTO:?defina URL_AUTH_BARRAMENTO}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-}
      - AUTH_JWT_PUBLIC_KEY_BASE64=${AUTH_JWT_PUBLIC_KEY_BASE64:-}
      - AUTH_SIMULATION_JWT_SECRET=${AUTH_SIMULATION_JWT_SECRET:-}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # settings.data.json e notificacoes.json sobrevivem a redeploy/atualização da imagem
      - farmacia_data:/app/data

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  farmacia-front:
    # Rollback: FRONT_TAG=front-<sha do commit>
    image: astecfsph/farmacia:${FRONT_TAG:-front}
    container_name: farmacia-front
    ports:
      - "5160:5160"
    restart: always
    depends_on:
      - farmacia-back

    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5160/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  farmacia_data:
